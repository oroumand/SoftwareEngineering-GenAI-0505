openapi: 3.1.0
info:
  title: User Profiles SDD Demo
  version: 1.0.0
paths:
  /api/users:
    post:
      summary: Register a user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserProfileRequest'
      responses:
        '201': { description: Created }
        '400': { description: Invalid input }
        '409': { description: Duplicate email }
    get:
      summary: List registered profiles
      responses:
        '200': { description: Profile list }
  /api/users/{id}:
    get:
      summary: Get a profile by id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Profile }
        '404': { description: Not found }
components:
  schemas:
    CreateUserProfileRequest:
      type: object
      additionalProperties: false
      required: [firstName, lastName, email, phoneNumber, dateOfBirth, country]
      properties:
        firstName: { type: string, minLength: 2, maxLength: 50 }
        lastName: { type: string, minLength: 2, maxLength: 50 }
        email: { type: string, format: email, maxLength: 254 }
        phoneNumber: { type: string, pattern: '^\+[1-9][0-9]{7,14}$' }
        dateOfBirth: { type: string, format: date }
        country: { type: string, pattern: '^[A-Za-z]{2}$' }

